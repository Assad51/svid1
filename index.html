<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Свидание для Юлии 💗</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #fff0f6);
    color: #6b2145;
    overflow-x: hidden;
  }
  .pig {
    position: fixed;
    font-size: 58px;
    opacity: .85;
    animation: float 4s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }
  .pig.p1 { left: 4%; top: 8%; }
  .pig.p2 { right: 5%; top: 18%; animation-delay: 1s; }
  .pig.p3 { left: 7%; bottom: 10%; animation-delay: 2s; }
  .pig.p4 { right: 7%; bottom: 7%; animation-delay: .5s; }
  @keyframes float {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-13px) rotate(3deg); }
  }
  .wrap {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
  }
  .card {
    width: min(620px, 100%);
    background: rgba(255,255,255,.94);
    border: 3px solid #ff9fc5;
    border-radius: 30px;
    padding: 38px 28px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(190, 69, 117, .18);
  }
  .piggy {
    font-size: 82px;
    line-height: 1;
    margin-bottom: 14px;
  }
  h1 {
    font-size: clamp(25px, 5vw, 38px);
    margin: 0 0 18px;
    color: #b72d68;
  }
  p {
    font-size: 20px;
    line-height: 1.5;
    margin: 12px auto 25px;
  }
  .buttons {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    border: 0;
    border-radius: 16px;
    padding: 14px 28px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
  }
  button:hover { transform: translateY(-2px) scale(1.02); }
  .yes, .primary {
    background: #f45b96;
    color: white;
    box-shadow: 0 8px 18px rgba(244,91,150,.25);
  }
  .no, .secondary {
    background: #ffe1ed;
    color: #a52c60;
  }
  .choice {
    display: grid;
    gap: 12px;
    margin: 20px 0;
  }
  .choice button {
    width: 100%;
    background: #fff0f6;
    border: 2px solid #ffb4d1;
    color: #8c2855;
  }
  .choice button.selected {
    background: #f45b96;
    color: white;
    border-color: #f45b96;
  }
  .hidden { display: none; }
  .small {
    font-size: 14px;
    color: #9b5b78;
    margin-top: 20px;
  }
  .heart {
    font-size: 25px;
    letter-spacing: 5px;
  }
  .hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 2;
  }
  .floating-heart {
    position: absolute;
    bottom: -50px;
    font-size: 24px;
    animation: rise 4s linear forwards;
  }
  @keyframes rise {
    from { transform: translateY(0) rotate(0deg); opacity: 0; }
    15% { opacity: 1; }
    to { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
  }
  #noBtn {
    position: relative;
  }
</style>
</head>
<body>

<div class="pig p1">🐷</div>
<div class="pig p2">🐖</div>
<div class="pig p3">🐷</div>
<div class="pig p4">🐖</div>
<div class="hearts" id="hearts"></div>

<div class="wrap">
  <main class="card">

    <section id="step1">
      <div class="piggy">🐷💗</div>
      <h1>Здравствуйте, Юлия!</h1>
      <p>Не хотите ли сходить на свидание<br>в это воскресенье?</p>
      <div class="buttons">
        <button class="yes" onclick="answerYes()">Да 💕</button>
        <button class="no" id="noBtn" onmouseenter="runAway()" onclick="answerNo()">Нет 🙈</button>
      </div>
    </section>

    <section id="step2" class="hidden">
      <div class="piggy">🐷🌸</div>
      <h1>Отлично! 💗</h1>
      <p>А какой вариант свидания Вам больше нравится?</p>
      <div class="choice">
        <button onclick="selectPlace(this, 'Прогулка на улице')">🌳 Прогулка на улице</button>
        <button onclick="selectPlace(this, 'Ресторан')">🍽️ Ресторан</button>
        <button onclick="selectPlace(this, 'Всё вместе')">💕 Всё вместе</button>
      </div>
      <button class="primary" onclick="finish()">Продолжить →</button>
      <p class="small">Можно выбрать только один вариант 😊</p>
    </section>

    <section id="step3" class="hidden">
      <div class="piggy">🐷🎀</div>
      <h1>Спасибо за внимание! 💗</h1>
      <p>Ваше мнение учтено.</p>
      <div class="heart">💗 🐷 💗</div>
    </section>

    <section id="stepNo" class="hidden">
      <div class="piggy">🐷🥺</div>
      <h1>Спасибо за честный ответ!</h1>
      <p>Ваше мнение учтено.<br>Хрю 🐷</p>
    </section>

  </main>
</div>

<!-- Скрытая форма отправляет ответы на почту через FormSubmit -->
<form id="mailForm"
      action="https://formsubmit.co/kremuh2@icloud.com"
      method="POST"
      target="mailFrame"
      style="display:none">
  <input type="hidden" name="_subject" value="Ответ Юлии на приглашение 💗">
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="Ответ на приглашение" id="answerField">
  <input type="hidden" name="Выбранный вариант" id="placeField">
</form>
<iframe name="mailFrame" style="display:none"></iframe>

<script>
  let place = "";

  function sendMail(answer, selectedPlace = "") {
    document.getElementById("answerField").value = answer;
    document.getElementById("placeField").value = selectedPlace || "Не выбран";
    document.getElementById("mailForm").submit();
  }

  function burstHearts() {
    const box = document.getElementById("hearts");
    const symbols = ["💗","💕","💖","💘","🐷","💞"];
    for (let i = 0; i < 18; i++) {
      const el = document.createElement("span");
      el.className = "floating-heart";
      el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      el.style.left = (Math.random() * 100) + "vw";
      el.style.animationDelay = (Math.random() * 0.8) + "s";
      el.style.fontSize = (18 + Math.random() * 22) + "px";
      box.appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }
  }

  function runAway() {
    const btn = document.getElementById("noBtn");
    const maxX = Math.min(window.innerWidth - 170, 280);
    const x = (Math.random() * maxX) - maxX / 2;
    const y = (Math.random() * 120) - 60;
    btn.style.transform = `translate(${x}px, ${y}px)`;
  }

  function answerYes() {
    sendMail("Да");
    burstHearts();
    document.getElementById("step1").classList.add("hidden");
    document.getElementById("step2").classList.remove("hidden");
  }

  function answerNo() {
    sendMail("Нет");
    document.getElementById("step1").classList.add("hidden");
    document.getElementById("stepNo").classList.remove("hidden");
  }

  function selectPlace(button, value) {
    document.querySelectorAll(".choice button").forEach(b => b.classList.remove("selected"));
    button.classList.add("selected");
    place = value;
  }

  function finish() {
    if (!place) {
      alert("Сначала выберите вариант свидания 🐷💕");
      return;
    }
    sendMail("Да", place);
    burstHearts();
    document.getElementById("step2").classList.add("hidden");
    document.getElementById("step3").classList.remove("hidden");
  }
</script>

</body>
</html>
